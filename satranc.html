<script>
/* ===== SVG TAŞLAR: 45x45 koordinat; dolgu gradyanı + ince detay çizgileri ===== */
const PS={
P:'<path d="M22.5 9a4 4 0 0 0-2.7 7c-2.4 1.3-3.8 3.7-3.8 6 0 2 1 3.6 2.4 4.8C15.2 28 11 32 11 39h23c0-7-4.2-11-7.4-12.2 1.4-1.2 2.4-2.8 2.4-4.8 0-2.3-1.4-4.7-3.8-6A4 4 0 0 0 22.5 9z"/><path class="dt" d="M16.5 26.5h12M12 35h21"/>',
R:'<path d="M9 39h27v-3H9v3zM12 36v-4h21v4H12zM11 14V9h4v2h5V9h5v2h5V9h4v5"/><path d="M34 14l-3 3H14l-3-3"/><path d="M31 17v12.5H14V17"/><path d="M31 29.5l1.5 2.5h-20l1.5-2.5"/><path class="dt" d="M11 14h23M14 17h17M14 29.5h17"/>',
N:'<path d="M22 10C32.5 11 38.5 18 38 39H15C15 30 25 32.5 23 18"/><path d="M24 18C24.4 20.9 18.5 25.4 16 27c-3 2-2.8 4.3-5 4-1-.9 1.4-3 0-3-1 0 .2 1.2-1 2-1 0-4 1-4-4 0-2 6-12 6-12s1.9-1.900 2-3.500c-.7-1-.5-2-.5-3 1-1 3 2.500 3 2.500h2s.8-2 2.500-3c1 0 1 3 1 3"/><path class="dt" d="M23 12c4 1 8 4 10 8M24 16c4 2 8 6 9 12M24 21c3 3 6 7 7 12"/><circle class="o" cx="12" cy="21" r="1.2" stroke-width=".8"/><circle cx="9.5" cy="25.5" r=".6" fill="#000"/>',
B:'<path d="M9 36c3.4-1 10.1.4 13.5-2 3.4 2.4 10.1 1 13.5 2 0 0 1.6.5 3 2-.7 1-1.600 1-3 .5-3.400-1-10.100.500-13.500-1-3.400 1.500-10.100 0-13.500 1-1.400.5-2.300.5-3-.5 1.400-1.500 3-2 3-2z"/><path d="M15 32c2.5 2.500 12.500 2.500 15 0 .5-1.500 0-2 0-2 0-2.500-2.500-4-2.500-4 5.500-1.500 6-11.500-5-15.500-11 4-10.500 14-5 15.500 0 0-2.500 1.500-2.500 4 0 0-.5.500 0 2z"/><circle cx="22.5" cy="8" r="2.500"/><path class="dt" d="M17.500 26h10M15 30h15"/><path class="o" d="M21 16l6 6" stroke-width="1.600"/>',
Q:'<path d="M9 26c8.500-1.500 21-1.500 27 0l2.500-12.500L31 25l-.3-14.100-5.200 13.600-3-14.500-3 14.500-5.200-13.600L14 25 6.500 13.500 9 26z"/><path d="M9 26c0 2 1.500 2 2.500 4 1 2.500 1 1 .5 3.500-1.500 1-1.500 2.500-1.500 2.500-1.500 1.500.5 2.500.5 2.500 6.500 1 16.500 1 23 0 0 0 1.500-1 0-2.500 0 0-.5-1.500-1-2.500-.5-2.500-.5-2 .5-3.500 1-2 2.500-2 2.500-4-8.500-1.500-18.500-1.500-27 0z"/><circle cx="6" cy="12" r="2.500"/><circle cx="14" cy="9" r="2.500"/><circle cx="22.500" cy="8" r="2.500"/><circle cx="31" cy="9" r="2.500"/><circle cx="39" cy="12" r="2.500"/><path class="dt" d="M11.500 30c3.500-1 18.500-1 22 0M12 33.500c6-1 15-1 21 0"/>',
K:'<path class="o" d="M22.500 11.600V6M20 8h5" stroke-width="1.800"/><path d="M22.500 25s4.500-7.500 3-10.500c0 0-1-2.500-3-2.500s-3 2.500-3 2.500c-1.500 3 3 10.500 3 10.500"/><path d="M11.500 37c5.500 3.500 15.500 3.500 21 0v-7s9-4.500 6-10.500c-4-6.500-13.500-3.500-16 4V27v-3.500c-3.500-7.500-13-10.500-16-4-3 6 5 10 5 10V37z"/><path class="dt" d="M11.500 30c5.500-3 15.500-3 21 0m-21 3.500c5.500-3 15.500-3 21 0m-21 3.500c5.500-3 15.500-3 21 0"/>'};
$=s=>document.querySelector(s);
let sy='<radialGradient id="gw" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fffef6"/><stop offset=".55" stop-color="#ece0bd"/><stop offset="1" stop-color="#b09b68"/></radialGradient><radialGradient id="gb" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#85858f"/><stop offset=".5" stop-color="#37373f"/><stop offset="1" stop-color="#0a0a0d"/></radialGradient>';
for(const c of'wb')for(const t in PS)sy+=`<symbol id="${c+t}" viewBox="0 0 45 45"><g class="${c}" fill="url(#g${c})" stroke="${c=='w'?'#2b2114':'#000'}" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">${PS[t]}</g></symbol>`;
$('#df').innerHTML=sy;

/* ===== SATRANÇ MOTORU: tahta 64 elemanlı dizi, 0=a8 ... 63=h1 ===== */
const FILES='abcdefgh',VAL={P:100,N:320,B:330,R:500,Q:900,K:0};
const KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]],DG=[[1,1],[1,-1],[-1,1],[-1,-1]],OR=[[1,0],[-1,0],[0,1],[0,-1]],AL=DG.concat(OR);
const sqn=i=>FILES[i&7]+(8-(i>>3)),opp=c=>c=='w'?'b':'w';
function init(){const b=Array(64).fill(null),k='RNBQKBNR';for(let f=0;f<8;f++){b[f]='b'+k[f];b[8+f]='bP';b[48+f]='wP';b[56+f]='w'+k[f]}return{b,t:'w',c:'KQkq',ep:-1,hm:0,fm:1}}
// kare "by" rengi tarafından tehdit ediliyor mu?
function att(b,sq,by){const r=sq>>3,f=sq&7,pr=by=='w'?r+1:r-1;
 for(const d of[-1,1]){const ff=f+d;if(pr>=0&&pr<8&&ff>=0&&ff<8&&b[pr*8+ff]==by+'P')return 1}
 for(const[dr,df]of KN){const rr=r+dr,ff=f+df;if(rr>=0&&rr<8&&ff>=0&&ff<8&&b[rr*8+ff]==by+'N')return 1}
 for(const[dr,df]of AL){const dg=dr&&df;for(let rr=r+dr,ff=f+df,k=1;rr>=0&&rr<8&&ff>=0&&ff<8;rr+=dr,ff+=df,k++){const p=b[rr*8+ff];if(p){if(p[0]==by){const T=p[1];if(T=='Q'||(dg?T=='B':T=='R')||(k==1&&T=='K'))return 1}break}}}
 return 0}
const inCheck=s=>att(s.b,s.b.indexOf(s.t+'K'),opp(s.t));
// sözde-yasal hamleler (x:yeme, e:en passant, dp:çift adım, p:terfi, cs:rok)
function gen(s){const{b,t}=s,o=opp(t),m=[],add=(f,to,x)=>m.push({f,t:to,...x});
 for(let i=0;i<64;i++){const p=b[i];if(!p||p[0]!=t)continue;const T=p[1],r=i>>3,f=i&7;
  if(T=='P'){const d=t=='w'?-1:1,r1=r+d,pm=r1==(t=='w'?0:7);
   const push=(to,x)=>{if(pm)for(const q of'QRBN')add(i,to,{...x,p:q});else add(i,to,x)};
   if(!b[r1*8+f]){push(r1*8+f);if(r==(t=='w'?6:1)&&!b[(r1+d)*8+f])add(i,(r1+d)*8+f,{dp:1})}
   for(const df of[-1,1]){const ff=f+df;if(ff<0||ff>7)continue;const to=r1*8+ff;if(b[to]&&b[to][0]==o)push(to,{x:1});else if(to==s.ep)add(i,to,{x:1,e:1})}
   continue}
  const dirs=T=='N'?KN:T=='B'?DG:T=='R'?OR:AL,one=T=='N'||T=='K';
  for(const[dr,df]of dirs)for(let rr=r+dr,ff=f+df;rr>=0&&rr<8&&ff>=0&&ff<8;rr+=dr,ff+=df){const to=rr*8+ff,q=b[to];if(!q)add(i,to);else{if(q[0]==o)add(i,to,{x:1});break}if(one)break}
  if(T=='K'){const base=t=='w'?56:0,L=t=='w'?'K':'k';
   if(i==base+4&&!att(b,i,o)){
    if(s.c.includes(L)&&!b[base+5]&&!b[base+6]&&b[base+7]==t+'R'&&!att(b,base+5,o)&&!att(b,base+6,o))add(i,base+6,{cs:'K'});
    if(s.c.includes(L.toLowerCase()==L?'q':'Q')&&!b[base+3]&&!b[base+2]&&!b[base+1]&&b[base]==t+'R'&&!att(b,base+3,o)&&!att(b,base+2,o))add(i,base+2,{cs:'Q'})}}}
 return m}
function make(s,m){const b=s.b.slice(),p=b[m.f],t=s.t;let c=s.c;
 b[m.t]=m.p?t+m.p:p;b[m.f]=null;
 if(m.e)b[m.f-(m.f&7)+(m.t&7)]=null;
 if(m.cs){const base=t=='w'?56:0;if(m.cs=='K'){b[base+5]=b[base+7];b[base+7]=null}else{b[base+3]=b[base];b[base]=null}}
 if(p[1]=='K')c=c.replace(t=='w'?/[KQ]/g:/[kq]/g,'');
 for(const[q,h]of[[0,'q'],[7,'k'],[56,'Q'],[63,'K']])if(m.f==q||m.t==q)c=c.replace(h,'');
 return{b,t:opp(t),c,ep:m.dp?(m.f+m.t)/2:-1,hm:(p[1]=='P'||m.x)?0:s.hm+1,fm:s.fm+(t=='b')}}
const legal=s=>gen(s); // şah tehdit altındayken bile her hamle serbest; şah alınınca oyun biter
// cebirsel gösterim (SAN)
function san(s,m,L){const p=s.b[m.f][1];let r;
 if(m.cs)r=m.cs=='K'?'O-O':'O-O-O';
 else{r=p=='P'?(m.x?FILES[m.f&7]:''):p;
  if(p!='P'){const o=L.filter(q=>q!=m&&s.b[q.f]==s.b[m.f]&&q.t==m.t);if(o.length){const sf=o.some(q=>(q.f&7)==(m.f&7)),sr=o.some(q=>(q.f>>3)==(m.f>>3));r+=!sf?FILES[m.f&7]:!sr?8-(m.f>>3):sqn(m.f)}}
  if(m.x)r+='x';r+=sqn(m.t);if(m.p)r+='='+m.p}
 const n=make(s,m);if(inCheck(n))r+=legal(n).length?'+':'#';return r}
const key=s=>s.b.map(p=>p||'.').join('')+s.t+s.c+s.ep;
function insuf(b){const a=[];b.forEach((p,i)=>{if(p&&p[1]!='K')a.push([p[1],((i>>3)+(i&7))&1])});return!a.length||(a.every(x=>x[0]=='B')&&a.every(x=>x[1]==a[0][1]))||(a.length==1&&a[0][0]=='N')}

/* ===== YAPAY ZEKÂ: negamax + alfa-beta ===== */
function ev(s){let v=0;for(let i=0;i<64;i++){const p=s.b[i];if(!p)continue;const T=p[1],r=i>>3,f=i&7,cn=4-Math.hypot(r-3.5,f-3.5);let x=VAL[T];
 if(T=='N')x+=cn*10;else if(T=='B')x+=cn*6;else if(T=='Q')x+=cn*2;else if(T=='P')x+=(p[0]=='w'?6-r:r-1)*8+cn*3;
 v+=p[0]=='w'?x:-x}return v}
const order=(s,L)=>L.map(m=>[m,(m.x?10*VAL[(s.b[m.t]||'bP')[1]]-VAL[s.b[m.f][1]]/10:0)+(m.p?800:0)]).sort((a,b)=>b[1]-a[1]).map(a=>a[0]);
function search(s,d,a,B){if(!s.b.includes(s.t+'K'))return -99999-d;if(!d)return(s.t=='w'?1:-1)*ev(s);let best=-1e9;for(const m of order(s,gen(s))){if(s.b[m.t]&&s.b[m.t][1]=='K')return 99999+d;const v=-search(make(s,m),d-1,-B,-a);if(v>best)best=v;if(v>a)a=v;if(a>=B)break}return best==-1e9?0:best}
function aiPick(){const s=cur(),d=lvl+0,nz=[160,25,4][lvl-1];let bm=null,bv=-1e9;
 for(const m of order(s,legal(s))){if(s.b[m.t]&&s.b[m.t][1]=='K')return m;const v=-search(make(s,m),d-1,-1e9,-(bv-nz-1))+Math.random()*nz;if(v>bv){bv=v;bm=m}}return bm}

/* ===== OYUN DURUMU ===== */
let G,cfg={mode:'ai',tc:'5,0',lvl:2,col:'w',cm:10,ci:0},sel=-1,tg=[],last=null,flip=false,mute=false,drag=null,my='w',mode='ai',lvl=2,room=null,inc=0,times={w:0,b:0},busy=false,act={},lt=Date.now();
const cur=()=>G.states[G.states.length-1],DR=w=>({res:'Berabere',why:w});
G={states:[init()],sans:[],mvs:[],caps:[],keys:[],over:true};

function newGame(o){mode=o.mode;botName=o.bot||'guggichees';my=o.my;document.body.classList.remove('h');hints=!!o.train;lvl=o.lvl||2;inc=o.inc;times={w:o.min*6e4,b:o.min*6e4};const s=init();
 G={states:[s],sans:[],mvs:[],caps:[],keys:[key(s)],over:false,bonus:o.bonus||0};sel=-1;tg=[];last=null;busy=false;flip=my=='b';closeM();banner(0);render();maybeAI()}
function check(){const s=cur(),L=legal(s),k=G.keys,wk=s.b.includes('wK'),bk=s.b.includes('bK');if(!wk||!bk)return{res:(wk?'Beyaz':'Siyah')+' kazandı',why:'Şah alındı'};const n=k.filter(x=>x==k[k.length-1]).length;

 try{if(!(window.claude&&claude.use))throw{message:'claude.use yok'};const R=await claude.use('room');if(!R)throw{message:'room kapalı'};

 const go=t=>{if(started)return;started=true;newGame({mode:'online',my:col,min:t[0],inc:t[1]})};

 rm.onPeers(c=>{const o=c.peers.filter(p=>!p.isMe);
  if(!started){const h=o.find(p=>p.presence&&p.presence.tc);if(col=='w'&&o.length)go(tc);else if(col=='b'&&h)go(h.presence.tc)}
  else if(!G.over)banner(!o.length)});

 rm.on('mv',m=>{if(m.isMe||!started||G.over)return;const d=m.data;if(d.n!=G.mvs.length||cur().t==my)return;const mv=legal(cur()).find(x=>x.f==d.f&&x.t==d.t&&x.p==d.p);if(mv)doMove(mv,1)});

function market(){const it=(k,o,id,c)=>{const own=P.own.includes(id);return `<div class="it"><i style="background:${c}"></i><b>${o.n}</b><br>${P[k]==id?'✔ Kullanımda':own?`<button data-a="${id}">Kullan</button>`:`<button class="pr" data-a="${id}">${o.p} puan</button>`}</div>`},a={x:closeM};
 for(const id in SK)a[id]=()=>buy(id);for(const id in BG)a[id]=()=>buy(id);
 openM(`<h2>🛒 Market</h2><p>💰 ${P.pts} puan</p><p>Taş setleri</p><div class="mk">${Object.entries(SK).map(([id,o])=>it('s',o,id,`linear-gradient(90deg,${o.w[0]},${o.w[2]},${o.b[1]},${o.b[2]})`)).join('')}</div><p>Arka planlar</p><div class="mk">${Object.entries(BG).map(([id,o])=>it('b',o,id,o.v[0]?`linear-gradient(90deg,${o.v[0]},${o.v[2]},${o.v[5]})`:'linear-gradient(90deg,#f4e0ba,#b98a5c,#5a3416)')).join('')}</div><p><button data-a="x">Kapat</button></p>`,a)}
// otomatik eşleşme: lobi odasında arayanlar sıralanıp ikişer ikişer eşlenir
function auto(){const btn=$('#am');if(SRV&&seeking)return stopSeek();if(lob){lob.leave();lob=null;btn.textContent='⚡ Otomatik eşleş';return}
 openM('<h2>Otomatik eşleşme</h2><p>Kiminle oynamak istersin?</p><p><button class="pr" data-a="pl">👥 Oyuncuyla</button> <button data-a="bt">🤖 Botla</button></p>',{pl:()=>{closeM();seek()},bt:()=>{closeM();bot()}})}
async function seek(){if(SRV)return seekSrv();const btn=$('#am');
 let L;try{L=lob=await(await claude.use('room')).join('satranc-lobby')}catch(e){lob=null;return toast('Online için yayınlanmış sayfada giriş gerekir')}
 btn.textContent='✖ Aramayı bırak';toast('Rakip aranıyor…');let done=0;L.presence({q:1});
 setTimeout(()=>{if(!done&&L===lob)openM('<h2>Rakip bulunamadı</h2><p>Şu an arayan başka oyuncu yok. Botla oynamak ister misin?</p><p><button class="pr" data-a="bt">🤖 Botla oyna</button> <button data-a="x">Aramaya devam</button></p>',{bt:()=>{L.leave();lob=null;btn.textContent='⚡ Otomatik eşleş';closeM();bot()},x:closeM})},12000);
 L.onPeers(c=>{if(done||L!==lob)return;const me=c.peers.find(p=>p.isMe&&p.sameTab)||c.peers.find(p=>p.isMe);if(!me)return;
  const sk=[...new Set(c.peers.filter(p=>p.presence&&p.presence.q&&(!p.isMe||p===me)).map(p=>p.peer))].sort(),i=sk.indexOf(me.peer);if(i<0||i>=sk.length||(i^1)>=sk.length)return;
  done=1;const a=sk[i&~1],b=sk[i|1],t=tcv();conn('m-'+a+'-'+b,me.peer==a?'w':'b',t);setTimeout(()=>{L.leave();if(lob===L){lob=null;btn.textContent='⚡ Otomatik eşleş'}},5000)})}
// bilinmedik isimli rastgele bot: rastgele renk ve seviye
function bot(){const N=['Kaan_47','mehmet.34','Zeynep','satranc_ustasi','xX_Vezir_Xx','Deniz','ali_baba','Elif.k','knightrider','Burak99'],t=tcv();newGame({mode:'ai',bot:N[Math.random()*N.length|0],my:Math.random()<.5?'w':'b',lvl:1+(Math.random()*3|0),min:t[0],inc:t[1]})}
$('#mt').onclick=market;// menü: etkinlikler, eğitim, uçan taşlar, ana menüye dönüş
function goHome(){leave();closeM();banner(0);document.body.classList.add('h');G.over=true;lb();mine()}
function events(){const d=new Date().toDateString(),got=P.dly==d;
 openM(`<h2>🎯 Etkinlikler</h2><div class="ev"><b>🎁 Günlük bonus</b><br>Her gün gel, +50 puan al.<br><button class="pr" data-a="dl" ${got?'disabled':''}>${got?'Bugün alındı ✔':'+50 puan al'}</button></div><div class="ev"><b>🔥 Zor bot meydan okuması</b><br>guggichees'i (Zor) yen: 200 puana ek +300 bonus.<br><button class="pr" data-a="ch">Başlat</button></div><p><button data-a="x">Kapat</button></p>`,
 {dl(){if(P.dly==d)return;P.dly=d;P.pts+=50;save();mine();lb();events()},ch(){const t=tcv();newGame({mode:'ai',my:Math.random()<.5?'w':'b',lvl:3,min:t[0],inc:t[1],bonus:300})},x:closeM})}
const LS=[['Tahta ve taşlar','Satranç 8x8 tahtada iki oyuncuyla oynanır. Her oyuncunun 16 taşı vardır: 1 şah, 1 vezir, 2 kale, 2 fil, 2 at, 8 piyon. Beyaz başlar. Amaç, rakibin şahını kaçacak yeri kalmayacak şekilde tehdit etmektir (şah mat).'],
['Piyon','İleri bir kare gider, ilk hamlesinde iki kare gidebilir. Yalnızca çapraz ileri yer. Son sıraya ulaşınca vezir, kale, fil veya ata terfi eder.','P'],
['At','"L" şeklinde gider: iki kare düz, bir kare yana. Diğer taşların üzerinden atlayabilen tek taştır. Merkezde güçlü, kenarda zayıftır.','N'],
['Fil','Çaprazlarda istediği kadar ilerler. Hep aynı renkli karelerde kalır; iki fil birbirini tamamlar.','B'],
['Kale','Düz (yatay/dikey) istediği kadar ilerler. Açık hatlarda ve oyun sonunda çok güçlüdür.','R'],
['Vezir','Kale ve fil gibi her yöne istediği kadar gider; en güçlü taştır. Erkenden riske atma.','Q'],
['Şah','Her yöne bir kare gider. Bu oyunda şah çekilse bile istediğin hamleyi yapabilirsin; ama rakip şahını alırsa oyunu kaybedersin.','K'],
['Özel hamleler','Rok: şah iki kare kaleye doğru gider, kale şahın yanına geçer (ikisi de hiç oynamamış, aradaki kareler boş, şah tehdit altında değil). En passant: rakip piyon iki kare ilerleyip yanında durursa hemen sonraki hamlede onu yiyebilirsin. Terfi: piyon son sıraya ulaşınca taş seçersin.'],
['Oyun sonuçları','Şah mat: kazanırsın. Pat: hamle yok ama şah tehdit altında değil, berabere. Üç kez aynı pozisyon, 50 hamlede yeme/piyon hamlesi olmaması veya yetersiz materyal de berabere sonuçlanır.'],
['Açılış ilkeleri','1) Merkezi (e4, d4) kontrol et. 2) At ve fillerini erken çıkar. 3) Erken rok yap. 4) Aynı taşla tekrar tekrar oynama. 5) Veziri erkenden çıkarma.'],
['Temel taktikler','Çatal: tek taşla iki hedefi birden tehdit etmek. Çivi: taş hareket ederse arkasındaki değerli taş yenir. Keşif şahı: bir taş çekilir, arkasındaki taş şah çeker. Değerler: piyon 1, at/fil 3, kale 5, vezir 9.']];
function learn(){openM('<h2>📚 Satranç eğitimi</h2>'+LS.map((l,i)=>`<button class="ch" data-a="l${i}" style="display:block;width:100%;text-align:left;margin:4px 0">${i+1}. ${l[0]}</button>`).join('')+'<p><button class="pr" data-a="tr">🎓 Pratik yap (ipuçlu)</button> <button data-a="x">Kapat</button></p>',Object.fromEntries([['x',closeM],['tr',()=>newGame({mode:'ai',bot:'Eğitmen',train:1,my:'w',lvl:1,min:30,inc:0})],...LS.map((l,i)=>['l'+i,()=>lesson(i)])]))}
function lesson(i){const l=LS[i];openM(`<h2>${l[0]}</h2>${l[2]?`<svg width="72" height="72" viewBox="0 0 45 45"><use href="#w${l[2]}"/></svg>`:''}<p>${l[1]}</p><p>${i?'<button data-a="p">◀ Önceki</button> ':''}<button data-a="b">Liste</button>${i<LS.length-1?' <button class="pr" data-a="n">Sonraki ▶</button>':''}</p>`,{p:()=>lesson(i-1),n:()=>lesson(i+1),b:learn})}
function fly(){let h='';for(let i=0;i<16;i++){const s=36+Math.random()*60|0;h+=`<svg class="fy" viewBox="0 0 45 45" style="left:${Math.random()*92|0}%;width:${s}px;height:${s}px;animation-duration:${14+Math.random()*16|0}s;animation-delay:-${Math.random()*20|0}s"><use href="#${'wb'[i%2]+'PNBRQK'[i%6]}"/></svg>`}$('#fly').innerHTML=h}
$('#go2').onclick=menu;$('#rm').onclick=()=>{cfg.mode='on';menu()};$('#lc').onclick=()=>{cfg.mode='lc';menu()};$('#ed').onclick=events;$('#ln').onclick=learn;
$('#am').onclick=auto;

$('#un').onclick=()=>{if(G.over||mode!='ai'||busy||G.mvs.length<2||cur().t!=my)return;
 for(let k=0;k<2;k++)for(const a of['states','sans','mvs','caps','keys'])G[a].pop();last=G.mvs[G.mvs.length-1]||null;sel=-1;tg=[];render()};
